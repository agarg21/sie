# Fork-only measurement harness (agarg21/sie): runs upstream ci.yml's
# "CI / Python" offline unit-test step alone on ubuntu-latest, because the
# upstream Blacksmith runner labels cannot run in a fork. Relative measurement:
# measure/base (single-process pytest) vs measure/fix (pytest-xdist).
name: unit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: CI / Python (unit tests only)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.5.5
          install_args: --jobs=1
          cache: false
      - run: nproc && free -g
      - run: mise run sync
      - name: Offline public unit tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: mise run test
